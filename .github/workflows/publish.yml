# Every merge to main that changes packaged code ships to PyPI.
#
# `version` in pyproject.toml is the source of truth: bump it in the PR to
# choose the release number (minor/major for new or breaking API surface).
# Leave it alone and this workflow takes the next free patch version, commits
# it back to main, and publishes — a merge can no longer land without a
# release. Pushing a `v*` tag by hand publishes that tag as-is.
name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-to-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Need the pushed range to tell packaged-code changes from docs-only.
          fetch-depth: 0

      - name: Resolve release version
        id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED="unknown range — releasing"
          else
            CHANGED=$(git diff --name-only "$BEFORE" HEAD -- rivermarkets pyproject.toml)
          fi
          if [[ -z "$CHANGED" ]]; then
            echo "No packaged code changed in this push — nothing to release." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITTED=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          IFS=. read -r MAJOR MINOR PATCH <<<"$COMMITTED"
          while git ls-remote --exit-code --tags origin "refs/tags/v$MAJOR.$MINOR.$PATCH" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
          done
          VERSION="$MAJOR.$MINOR.$PATCH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ "$VERSION" != "$COMMITTED" ]]; then
            echo "pyproject.toml still reads $COMMITTED (already released) — releasing $VERSION." >> "$GITHUB_STEP_SUMMARY"
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
            git commit -am "Bump version to $VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "Publishing rivermarkets $VERSION to PyPI." >> "$GITHUB_STEP_SUMMARY"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.release.outputs.publish == 'true'
        with:
          python-version: "3.12"

      - name: Build
        if: steps.release.outputs.publish == 'true'
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        if: steps.release.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
